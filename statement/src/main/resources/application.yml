spring:
  application:
    name: statement-service
  profiles:
    active: default

server:
  port: 8082

springdoc:
  api-docs:
    path: /api-docs
  servers:
    - url: /api/v1/statement
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

client:
  deal:
    address: http://localhost:8081
    url: /api/v1/deal
    api:
      calculate:
        path: /statement
      select:
        path: /offer/select

gateway:
  service:
    url: http://localhost:8084

credit:
  support:
    logging:
      enabled: true