server:
  port: 8082

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    org.neoflex.statement: DEBUG
    org.neoflex.statement.interceptor: DEBUG
    org.springframework.web: INFO
    org.springframework.web.servlet: INFO
