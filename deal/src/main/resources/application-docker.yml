server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db.changelog/db.changelog-master.xml
    default-schema: public
    drop-first: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    org.neoflex.deal: DEBUG
    org.neoflex.statement.interceptor: DEBUG
    org.hibernate.SQL: ERROR
    org.hibernate.type: ERROR
    org.hibernate.engine.jdbc: WARN

calculator:
  service:
    url: ${CALCULATOR_SERVICE_URL:http://calculator:8080}
  endpoints:
    base: "${CALCULATOR_ENDPOINTS_BASE:/api/v1/calculator}"
    offers: "${CALCULATOR_ENDPOINTS_OFFERS:/offers}"
    calc: "${CALCULATOR_ENDPOINTS_CALC:/calc}"