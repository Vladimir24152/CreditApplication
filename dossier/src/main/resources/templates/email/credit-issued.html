<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Кредит одобрен</title>
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #4CAF50; color: white; padding: 10px; text-align: center; }
        .content { padding: 20px; border: 1px solid #ddd; }
        .footer { font-size: 12px; color: #999; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h2>Кредит одобрен!</h2></div>
    <div class="content">
        <p>Уважаемый клиент!</p>
        <p>Поздравляем! Ваша кредитная заявка <strong th:text="'№' + ${statementId}"></strong> одобрена.</p>
        <p th:text="${text}"></p>
        <p>Деньги будут перечислены в течение 24 часов на указанный вами счёт.</p>
        <p>С уважением,<br>Команда кредитного отдела</p>
    </div>
    <div class="footer">
        <p>Это автоматическое сообщение, пожалуйста, не отвечайте на него.</p>
        <p>© 2024 Кредитная система</p>
    </div>
</div>
</body>
</html>
