<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Отправка документов</title>
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #4CAF50; color: white; padding: 10px; text-align: center; }
        .content { padding: 20px; border: 1px solid #ddd; }
        .footer { font-size: 12px; color: #999; text-align: center; margin-top: 20px; }
        .button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .button:hover { background-color: #45a049; }
        form { margin: 20px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h2>Документы отправлены</h2></div>
    <div class="content">
        <p>Уважаемый клиент!</p>
        <p th:text="${text}"></p>
        <p>Номер заявки: <strong th:text="${statementId}"></strong></p>

        <form th:action="${dealUrl} + '/api/v1/deal/document/' + ${statementId} + '/sign'" method="post">
            <button type="submit" class="button">Подписать документы</button>
        </form>

        <p>С уважением,<br>Команда кредитного отдела</p>
    </div>
    <div class="footer">
        <p>Это автоматическое сообщение, пожалуйста, не отвечайте на него.</p>
        <p>© 2026 Кредитная система</p>
    </div>
</div>
</body>
</html>
